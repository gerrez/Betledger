<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BetLedger home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5241D0}a:hover{color:#3F2FB8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F7FB; color: #16151F; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 120px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13px; color: #5B5970;">BetLedger</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em;">Overview</h1>
      </div>
      <button type="button" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E6F0; background: #FFFFFF; color: #16151F; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
        October 2026
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 20px; box-shadow: 0 1px 2px rgba(22,21,31,0.04), 0 6px 20px rgba(22,21,31,0.05); display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 14px; color: #5B5970;">Profit this month</span>
        <span style="font-size: 13px; font-weight: 600; color: #067647; background: #E7F8EF; padding: 4px 10px; border-radius: 999px;">ROI 6.2%</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 38px; font-weight: 600; letter-spacing: -0.03em; color: #067647;">+1,240.50</span>
        <span style="font-size: 16px; font-weight: 500; color: #5B5970;">kr</span>
      </div>
      <svg width="100%" height="64" viewBox="0 0 300 64" preserveAspectRatio="none" aria-label="Cumulative profit this month, rising" role="img">
        <path d="{{sparkArea}}" fill="#EFEDFD" stroke="none"></path>
        <path d="{{sparkLine}}" fill="none" stroke="#6C5CE7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
      </svg>
      <span style="font-size: 13px; color: #5B5970;">32 bets settled · turnover 19,980.00 kr</span>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; border: 1px solid #EEEDF4;">
          <span style="font-size: 13px; color: #5B5970;">{{k.label}}</span>
          <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.02em;">{{k.value}}</span>
          <span style="font-size: 12px; color: #5B5970;">{{k.sub}}</span>
        </div>
      </sc-for>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600;">Open bets <span style="color: #5B5970; font-weight: 500;">· 3</span></h2>
        <a href="Bets.dc.html" style="font-size: 14px; font-weight: 500; text-decoration: none; padding: 10px 0;">Settle →</a>
      </div>
      <sc-for list="{{openBets}}" as="b" hint-placeholder-count="2">
        <a href="Bets.dc.html" style="text-decoration: none; color: #16151F; background: #FFFFFF; border-radius: 16px; padding: 14px 16px; border: 1px solid #EEEDF4; display: flex; align-items: center; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
            <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{b.title}}</span>
            <span style="font-size: 13px; color: #5B5970;">{{b.sub}}</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px;">
            <span style="font-size: 15px; font-weight: 600;">{{b.stake}}</span>
            <span style="font-size: 13px; color: #5B5970;">{{b.odds}}</span>
          </div>
        </a>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 16px 20px; background: #FFFFFF; border-top: 1px solid #EEEDF4; display: flex; align-items: center; justify-content: space-between;">
    <a href="Main.dc.html" aria-current="page" style="width: 60px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5241D0; font-size: 11px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      Home
    </a>
    <a href="Bets.dc.html" style="width: 60px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B5970; font-size: 11px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      Bets
    </a>
    <a href="NewBet.dc.html" aria-label="New bet" style="width: 56px; height: 56px; border-radius: 18px; background: #6C5CE7; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(108,92,231,0.35);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="Statistics.dc.html" style="width: 60px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B5970; font-size: 11px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      Stats
    </a>
    <a href="Main.dc.html" style="width: 60px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B5970; font-size: 11px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var pts = [0, 120, 80, 310, 260, 540, 720, 650, 980, 1240.5];
    var max = 1300, w = 300, h = 64;
    var coords = pts.map(function (v, i) {
      var x = (i / (pts.length - 1)) * w;
      var y = h - 4 - (v / max) * (h - 8);
      return x.toFixed(1) + ' ' + y.toFixed(1);
    });
    var line = 'M' + coords.join(' L');
    var area = line + ' L' + w + ' ' + h + ' L0 ' + h + ' Z';
    return {
      sparkLine: line,
      sparkArea: area,
      kpis: [
        { label: 'Strike rate', value: '55%', sub: '17 of 31 decided' },
        { label: 'Average odds', value: '2.04', sub: 'settled bets' },
        { label: 'Closing line', value: '+3.1%', sub: 'CLV on 18 bets' },
        { label: 'Open stake', value: '1,542 kr', sub: '3 bets pending' }
      ],
      openBets: [
        { title: 'Arsenal v Chelsea', sub: 'Arsenal −0.25 · Pinnacle · 18:30', stake: '€200.00', odds: '@ 1.95' },
        { title: '3-fold accumulator', sub: '2 of 3 won · Bet365', stake: '50.00 kr', odds: '@ 5.41' }
      ]
    };
  }
}
</script>
</body>
</html>
